<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts | Attendee</title>
    <link rel="stylesheet" href="../common/global.css">
    <link rel="stylesheet" href="accounts.css">
    <script src="../common/navigation.js" defer></script>
</head>
<body>
    <main class="main-content">
        <h1 class="page-title">Accounts</h1>
        
        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-label">Total accounts</span>
                <div class="stat-value" id="ct">—</div>
                <div class="stat-line blue"></div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Active</span>
                <div class="stat-value" id="ca">—</div>
                <div class="stat-line green"></div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Inactive</span>
                <div class="stat-value" id="ci">—</div>
                <div class="stat-line red"></div>
            </div>
        </div>

        <div class="table-controls">
            <div class="controls-top-row">
                <div class="search-wrapper">
                    <input type="text" id="srch" placeholder="Search accounts..." class="search-input" oninput="fil()">
                </div>
                <div class="dropdown-wrapper">
                    <select id="statusFilter" class="location-dropdown" onchange="fil()">
                        <option value="all">All status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <!-- New Role Filter Dropdown -->
                <div class="dropdown-wrapper">
                    <select id="roleFilter" class="location-dropdown" onchange="fil()">
                        <option value="all">All Roles</option>
                        <option value="medrep">MedRep</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button class="add-account-btn" onclick="addAccount()">+ Add account</button>
            </div>
            <div class="controls-bottom-row">
                <span id="shw" class="rep-count">Showing 0 accounts</span>
            </div>
        </div>

        <div class="rep-list-container" id="list"></div>
    </main>

    <!-- ── Account Modal (Add/Edit) ── -->
    <div id="accountModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Account Details</h2>
                <button class="modal-close" onclick="closeAccountModal()">✕</button>
            </div>

            <div class="modal-body-pad">
                <form id="accountForm" class="modal-form" onsubmit="saveAccount(event)">
                    <input type="hidden" id="accId">

                    <div class="form-grid">
                        <div class="field-group">
                            <label>First Name</label>
                            <input type="text" id="fName" required placeholder="Enter first name">
                        </div>

                        <div class="field-group">
                            <label>Last Name</label>
                            <input type="text" id="lName" required placeholder="Enter last name">
                        </div>

                        <div class="field-group">
                            <label>Employee ID</label>
                            <input type="text" id="empId" required placeholder="EMP-000">
                        </div>

                        <!-- Status field remains a dropdown -->
                        <div class="field-group">
                            <label>Status</label>
                            <select id="statusInput">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        
                        <!-- District and Area / Assignment side-by-side -->
                        <div class="field-group">
                            <label>District</label>
                            <input type="text" id="districtInput" required placeholder="Enter district">
                        </div>
                        <div class="field-group">
                            <label>Area / Assignment</label>
                            <input type="text" id="areaInput" required placeholder="e.g. North, South, Matigas City">
                        </div>

                        <!-- New Constant Time field -->
                        <div class="field-group full-width">
                            <label>Constant Time</label>
                            <input type="time" id="timeInput">
                        </div>

                        <!-- New Roles field (visibility controlled by JS based on currentUserRole) -->
                        <div class="field-group full-width" id="roleGroup">
                            <label>Role</label>
                            <select id="roleInput" required>
                                <option value="medrep">MedRep</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="save-btn" id="submitBtn">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../common/backend_connection.js"></script>
    <script src="accounts.js"></script>
</body>
</html>
