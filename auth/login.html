<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Portal - Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
</head>
<body class="login-page">

    <div class="login-card" id="loginArea">
        <h1 class="portal-header">MEDICAL <br><span class="highlight">PORTAL</span></h1>

        <form id="loginForm">
            <div class="input-group">
                <label>EMPLOYEE I.D</label>
                <div class="field-wrapper">
                    <input type="text" id="username" placeholder="Enter I.D." required>
                    <span class="field-icon">👤</span>
                </div>
            </div>

            <div class="input-group">
                <label>PASSWORD</label>
                <div class="field-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="eyebtn" id="togglePassword">
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#355872" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="button-row" style="margin-top: 30px;">
                <button type="submit" class="login-btn">LOGIN</button>
            </div>
        </form>
    </div>

    <div class="login-card" id="forceChangePasswordArea" style="display: none;">
        <h1 class="portal-header">SET NEW <br><span class="highlight">PASSWORD</span></h1>
        <p style="font-size: 12px; color: #666; margin-bottom: 20px;">Your account is new. Please set a secure password to continue.</p>
        
        <form id="forceChangeForm">
            <div class="input-group">
                <label>NEW PASSWORD</label>
                <div class="field-wrapper">
                    <input type="password" id="newPassword" placeholder="••••••••" required>
                </div>
            </div>
            <div class="input-group">
                <label>CONFIRM PASSWORD</label>
                <div class="field-wrapper">
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
            </div>
            <div class="button-row">
                <button type="submit" class="login-btn">UPDATE & LOGIN</button>
            </div>
        </form>
    </div>

    <script src="../common/backend_connection.js"></script>
    <script src="login.js"></script>
</body>
</html>
