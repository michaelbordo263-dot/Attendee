<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts | Attendee</title>
    <link rel="stylesheet" href="../common/global.css">
    <link rel="stylesheet" href="accounts.css">
    <script src="../common/navigation.js" defer></script>
</head>
<body>
    <main class="main-content">
        <h1 class="page-title">Accounts</h1>
        
        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-label">Total accounts</span>
                <div class="stat-value" id="ct">—</div>
                <div class="stat-line blue"></div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Active</span>
                <div class="stat-value" id="ca">—</div>
                <div class="stat-line green"></div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Inactive</span>
                <div class="stat-value" id="ci">—</div>
                <div class="stat-line red"></div>
            </div>
        </div>

        <div class="table-controls">
            <div class="controls-top-row">
                <div class="search-wrapper">
                    <input type="text" id="srch" placeholder="Search accounts..." class="search-input" oninput="fil()">
                </div>
                <div class="dropdown-wrapper">
                    <select id="statusFilter" class="location-dropdown" onchange="fil()">
                        <option value="all">All status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="dropdown-wrapper">
                    <select id="roleFilter" class="location-dropdown" onchange="fil()">
                        <option value="all">All Roles</option>
                        <option value="medrep">MedRep</option>
                        <option value="admin">Admin</option>
                        <option value="super_admin">Super Admin</option>
                    </select>
                </div>
                <button class="add-account-btn" onclick="addAccount()">+ Add account</button>
            </div>
            <div class="controls-bottom-row">
                <span id="shw" class="rep-count">Showing 0 accounts</span>
            </div>
        </div>

        <div class="rep-list-container" id="list"></div>
    </main>

    <!-- ── Account Modal (Add/Edit) ── -->
    <div id="accountModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Account Details</h2>
                <button class="modal-close" onclick="closeAccountModal()">✕</button>
            </div>

            <div class="modal-body-pad">
                <form id="accountForm" class="modal-form" onsubmit="saveAccount(event)">
                    <input type="hidden" id="accId">

                    <div class="form-grid">
                        <div class="field-group">
                            <label>First Name</label>
                            <input type="text" id="fName" required placeholder="Enter first name" autocapitalize="words" style="text-transform: capitalize;">
                        </div>

                        <div class="field-group">
                            <label>Middle Name</label>
                            <input type="text" id="mName" placeholder="Enter middle name" autocapitalize="words" style="text-transform: capitalize;">
                        </div>

                        <div class="field-group">
                            <label>Last Name</label>
                            <input type="text" id="lName" required placeholder="Enter last name" autocapitalize="words" style="text-transform: capitalize;">
                        </div>

                        <div class="field-group">
                            <label>Employee ID</label>
                            <input type="text" id="empId" required placeholder="EMP0000">
                        </div>

                        <div class="field-group">
                            <label>District</label>
                            <input type="text" id="districtInput" placeholder="Enter district" autocapitalize="words" style="text-transform: capitalize;">
                        </div>

                        <div class="field-group">
                            <label>Area / Assignment</label>
                            <input type="text" id="areaInput" placeholder="Enter area/assignment" autocapitalize="words" style="text-transform: capitalize;">
                        </div>

                        <div class="field-group">
                            <label>Constant Time</label>
                            <input type="time" id="timeInput" value="09:30" readonly>
                        </div>

                        <div class="field-group">
                            <label>Status</label>
                            <select id="statusInput">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>

                        <!-- Reset Password Trigger -->
                        <div class="field-group full-width" id="resetBtnContainer" style="display: none; margin-bottom: 10px;">
                            <button type="button" id="resetPasswordBtn" onclick="triggerForceReset()" 
                                style="width: 100%; background-color: #ffffff; border: 1px solid #3e627a; color: #3e627a; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 16px; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                                Reset Password
                            </button>
                        </div>

                        <div class="field-group full-width" id="roleGroup">
                            <label>Role</label>
                            <select id="roleInput" required>
                                <option value="medrep">MedRep</option>
                                <option value="admin">Admin</option>
                                <option value="super_admin">Super Admin</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="save-btn" id="submitBtn">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ── Confirmation Modal ── -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box" style="width: 400px;">
            <div class="modal-header">
                <h2 id="confirmTitle">Confirm Action</h2>
            </div>
            <div class="modal-body-pad" style="text-align: center;">
                <p id="confirmMessage" style="font-size: 15px; color: #444; margin-bottom: 24px;"></p>
                <div style="display: flex; gap: 12px;">
                    <button onclick="closeConfirmModal()" 
                        style="flex:1; padding: 12px; border-radius: 10px; border: 1.5px solid #d0d8e4; background: white; font-weight: 700; color: #666; cursor: pointer; font-size: 15px;">
                        Cancel
                    </button>
                    <button id="confirmOkBtn"
                        style="flex:1; padding: 12px; border-radius: 10px; border: none; background: #355872; color: white; font-weight: 700; cursor: pointer; font-size: 15px;">
                        Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Alert Modal ── -->
    <div id="alertModal" class="modal-overlay">
        <div class="modal-box" style="width: 400px;">
            <div class="modal-header">
                <h2 id="alertTitle">Notice</h2>
            </div>
            <div class="modal-body-pad" style="text-align: center;">
                <p id="alertMessage" style="font-size: 15px; color: #444; margin-bottom: 24px;"></p>
                <button id="alertOkBtn"
                    style="width: 100%; padding: 12px; border-radius: 10px; border: none; background: #355872; color: white; font-weight: 700; cursor: pointer; font-size: 15px;">
                    OK
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../common/backend_connection.js"></script>
    <script src="accounts.js"></script>
</body>
</html>
