<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance | Attendee</title>
    
    <link rel="stylesheet" href="../common/global.css">
    <link rel="stylesheet" href="performance.css">
    
    <script src="../common/navigation.js" defer></script>
    <script src="../common/global_data.js" defer></script>
</head>
<body>

    <div id="sync-overlay">
        <div class="spinner"></div>
        <p>Syncing Performance Data...</p>
    </div>

    <main class="main-content">
        <div class="summary-grid">
            <div class="summary-card">
                <span class="val" id="kpi-total">0</span>
                <span class="lbl">Total MedReps</span>
            </div>
            <div class="summary-card">
                <span class="val" id="kpi-signed">0</span>
                <span class="lbl">Signed & Selfie Documents</span>
            </div>
            <div class="summary-card">
                <span class="val" id="kpi-missed">0</span>
                <span class="lbl">Rejected Visits</span>
            </div>
            <div class="summary-card highlight">
                <span class="val" id="kpi-rate">0</span>
                <span class="lbl">MIA Visits</span>
            </div>
        </div>

        <div class="main-wrapper-card">
            <div class="filter-navigation-bar">
                <div class="search-wrapper-group">
                    <div class="search-wrapper">
                        <input type="text" id="perf-search" placeholder="Search Rep..">
                        <span class="search-icon">&#128269;</span>
                    </div>
                    <p class="results-info" id="results-count">Initializing...</p>
                </div>

                <div class="nav-selectors">
                    <button id="refresh-btn" class="btn-refresh" title="Refresh Data">
                        &#x21bb; <span>Refresh</span>
                    </button>

                    <div class="selector-box">
                        <button class="nav-arrow" id="q-prev">&lt;</button>
                        <div class="selector-content">
                            <span class="main-val" id="quarter-label">Q1</span>
                            <span class="sub-lbl">Current Quarter</span>
                        </div>
                        <button class="nav-arrow" id="q-next">&gt;</button>
                    </div>
                    <div class="selector-box">
                        <button class="nav-arrow" id="y-prev">&lt;</button>
                        <div class="selector-content">
                            <span class="main-val" id="year-label">2026</span>
                            <span class="sub-lbl">Current Year</span>
                        </div>
                        <button class="nav-arrow" id="y-next">&gt;</button>
                    </div>
                </div>
            </div>

            <div class="scrollable-content">
                <div id="performance-grid" class="cards-grid"></div>
            </div>
        </div>
    </main>

    <script src="../common/backend_connection.js"></script>
    <script src="performance.js"></script>
    
</body>
</html>
