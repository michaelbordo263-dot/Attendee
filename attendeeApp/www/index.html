<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline'; 
                   style-src 'self' 'unsafe-inline'; 
                   media-src *; 
                   img-src 'self' data: content:; 
                   connect-src 'self' 
                               https://api.premierpharmaceuticalsmarketingcorporation.cloud 
                               https://qsajjswydcucjtuglwai.supabase.co 
                               http://127.0.0.1:5000;">

    <title>Attendee App</title>

    <script src="cordova.js"></script>

    <script>
        function goToApp() {
            const userId = localStorage.getItem('user_id');
            
            if (userId) {
                window.location.replace("dashboard/dashboard.html");
            } else {
                window.location.replace("auth/login.html");
            }
        }

        // Fire redirect when Cordova is fully ready
        document.addEventListener("deviceready", goToApp, false);

        // Fallback ONLY for PC browser, never on real device
        const isRealDevice = /Android|iPhone|iPad/i.test(navigator.userAgent);
        if (!isRealDevice && !window.hasOwnProperty('cordova')) {
            document.addEventListener("DOMContentLoaded", function () {
                setTimeout(goToApp, 100);
            });
        }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #0f172a;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <h3>Loading Attendee App...</h3>
</body>
</html>
