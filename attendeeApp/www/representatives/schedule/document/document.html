<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Page</title>
    <link rel="stylesheet" href="../../../common/global.css">
    <link rel="stylesheet" href="../schedule.css">
    <link rel="stylesheet" href="document.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <button class="back-btn" id="goBack">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h2 class="title">Document</h2>
        </div>
    </header>

    <main class="main-content">
        <div class="content-grid">

            <!-- LEFT COLUMN: Doctor Info -->
            <div class="info-column">

                <h3 class="section-title">BASIC INFORMATION</h3>
                <div class="field-row">
                    <div class="field-group">
                        <label>First Name</label>
                        <div class="field-data" id="doc-first-name">—</div>
                    </div>
                    <div class="field-group">
                        <label>Last Name</label>
                        <div class="field-data" id="doc-last-name">—</div>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field-group">
                        <label>Middle Name</label>
                        <div class="field-data" id="doc-mid-name">—</div>
                    </div>
                    <div class="field-group suffix-group">
                        <label>Suffix</label>
                        <div class="field-data" id="doc-suffix">—</div>
                    </div>
                </div>

                <h3 class="section-title">PROFESSIONAL DATA</h3>
                <div class="field-row">
                    <div class="field-group">
                        <label>MD Code</label>
                        <div class="field-data" id="doc-md-code">—</div>
                    </div>
                    <div class="field-group">
                        <label>Specialization</label>
                        <div class="field-data" id="doc-md-desc">—</div>
                    </div>
                </div>
                <div class="field-group" style="margin-bottom: 15px;">
                    <label>Hospital / Clinic Affiliation</label>
                    <div class="field-data" id="doc-hospital">—</div>
                </div>

                <h3 class="section-title">LOCATION DETAILS</h3>
                <div class="field-group" style="margin-bottom: 10px;">
                    <label>Building / Street / Barangay</label>
                    <div class="field-data" id="doc-bldg">—</div>
                </div>
                <div class="field-group" style="margin-bottom: 15px;">
                    <label>City / Province</label>
                    <div class="field-data" id="doc-address">—</div>
                </div>

                <h3 class="section-title">VISIT LOG</h3>
                <div class="radio-row">
                    <label class="radio-label" id="label-signed">
                        <input type="radio" name="visitStatus" value="signed" disabled>
                        <span class="radio-custom signed"></span>
                        Signed
                    </label>
                    <label class="radio-label" id="label-mia">
                        <input type="radio" name="visitStatus" value="mia" disabled>
                        <span class="radio-custom mia"></span>
                        MIA
                    </label>
                    <label class="radio-label" id="label-rejected">
                        <input type="radio" name="visitStatus" value="rejected" disabled>
                        <span class="radio-custom rejected"></span>
                        Rejected
                    </label>
                </div>

            </div>

            <!-- RIGHT COLUMN: Dynamic Panel -->
            <div class="action-column" id="action-column">

                <!-- DEFAULT / SIGNED: Items Grid -->
                <div id="panel-items" style="display: none;">
                    <h3 class="section-title">ITEMS SELECTED</h3>
                    <div class="item-grid" id="product-list"></div>
                    <div id="signature-wrapper" style="display: none; margin-top: 20px;">
                        <button class="btn-signature" id="signatureBtn">
                            <i class="fas fa-signature"></i> View Signature
                        </button>
                    </div>
                </div>

                <!-- MIA / REJECTED: Remarks Panel -->
                <div id="panel-remarks" style="display: none;">
                    <div class="remarks-panel">
                        <div class="remarks-badge" id="remarks-badge">MIA</div>
                        <p class="remarks-hint" id="remarks-hint">The representative marked this visit as MIA.</p>
                        <h3 class="section-title" style="margin-top: 20px;">REMARKS / NOTES</h3>
                        <div class="field-data remarks-box" id="doc-remarks">No remarks provided.</div>
                    </div>
                </div>

                <!-- NO STATUS: Default empty items -->
                <div id="panel-default" style="display: none;">
                    <h3 class="section-title">ITEMS SELECTED</h3>
                    <div class="item-grid" id="product-list-default"></div>
                </div>

            </div>
        </div>
    </main>

    <!-- Signature Modal -->
    <div id="signature-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title"><i class="fas fa-signature"></i> Doctor's Signature</span>
                <button class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="sig-frame" id="sig-frame">
                    <img id="sig-img" src="" alt="Signature" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px;" />
                    <div id="sig-placeholder" class="sig-placeholder">
                        <i class="fas fa-file-signature"></i>
                        <span>No signature image available</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <span class="modal-sub" id="modal-doctor-name"></span>
                <button class="modal-close-btn" id="closeModalBtn">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="document.js"></script>
</body>
</html>
