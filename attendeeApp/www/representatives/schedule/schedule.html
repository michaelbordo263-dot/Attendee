<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Attendee System</title>
    
    <link rel="stylesheet" href="schedule.css">
    
    <link rel="stylesheet" href="../../common/global_page_header.css">
    <script src="../../common/global_data.js" defer></script>
</head>
<body>

    <div class="schedule-wrapper">
        <header class="main-header">
            <h1 class="title">Schedule</h1>
            <div class="profile-avatar"></div>
        </header>

        <div class="rep-sub-nav">
            <div class="rep-left-section">
                <button class="back-btn" id="goBack" onclick="window.location.href='../representatives.html'"> < </button> 
                <div class="rep-meta">
                    <div class="user-info-stack">
                        <span class="name-label" id="rep-name">Loading...</span>
                        <span class="area-label" id="rep-location">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="status-tabs">
                <a href="#" class="tab-link active">Schedule</a>
                <a href="javascript:void(0)" id="requestTab" class="tab-link">
                    Request <span class="alert-dot" id="requestAlertDot" style="display:none;"></span>
                </a>
            </div>
        </div>

        <section class="calendar-content">
            <div class="calendar-controls">
                <!-- LEFT: spacer to balance layout -->
                <div class="controls-right-spacer"></div>

                <!-- CENTER: Month/Year with prev/next pills flanking it -->
                <div class="month-nav-group">
                    <button class="btn-pill" id="prevMonth"> &lt; </button>
                    <div class="date-label">
                        <span class="m" id="monthName">April</span>
                        <span class="y" id="yearNumber">2026</span>
                    </div>
                    <button class="btn-pill" id="nextMonth"> &gt; </button>
                </div>

                <!-- RIGHT: Search Doctor aligned to Request tab edge -->
                <div class="search-input-wrapper">
                    <input type="text" placeholder="- Search -">
                    <span class="icon">🔍</span>
                </div>
            </div>

            <div class="calendar-grid" id="calendarGrid">
                <div class="day-name">SUN</div><div class="day-name">MON</div>
                <div class="day-name">TUE</div><div class="day-name">WED</div>
                <div class="day-name">THU</div><div class="day-name">FRI</div>
                <div class="day-name">SAT</div>
            </div>
        </section>
    </div>

    <div id="dateModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDateTitle">April 1, 2026</h2>
                <button class="close-modal" id="closeModalBtn">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="schedule.js"></script>
</body>
</html>
